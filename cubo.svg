<svg width="150" height="150" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(0, 5)">
    <!-- Face Superior (Azul Claro) -->
    <polygon points="50,15 85,32.5 50,50 15,32.5" fill="#58A6FF" />
    
    <!-- Face Esquerda (Cinza/Azul Escuro) -->
    <polygon points="15,32.5 50,50 50,85 15,67.5" fill="#1F6FEB" />
    
    <!-- Face Direita (Fundo escuro nativo) -->
    <polygon points="50,50 85,32.5 85,67.5 50,85" fill="#0D419D" />

    <!-- Detalhes "Hacker/Pixel" (Linhas e pontos) -->
    <line x1="50" y1="15" x2="50" y2="50" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
    <line x1="15" y1="32.5" x2="50" y2="50" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
    <line x1="85" y1="32.5" x2="50" y2="50" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
    
    <!-- Pontos flutuantes para dar efeito de dados -->
    <circle cx="20" cy="20" r="1.5" fill="#2EA043" opacity="0.8"/>
    <circle cx="80" cy="80" r="1.5" fill="#58A6FF" opacity="0.8"/>
    <circle cx="85" cy="25" r="1" fill="#8B949E" opacity="0.5"/>
    <circle cx="15" cy="80" r="1" fill="#8B949E" opacity="0.5"/>
  </g>
</svg>
